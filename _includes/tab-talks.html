{%- comment -%} Talks tab: every _talks/ entry, sorted by `order` (1 = top). {%- endcomment -%}
{%- assign talks = site.talks | sort: "order" %}
<h1 class="visually-hidden">{{ include.t.tab_talks }}</h1>
<div class="stack">
  {%- for talk in talks %}
  {% include talk-card.html talk=talk lang=include.lang t=include.t %}
  {%- endfor %}
</div>
