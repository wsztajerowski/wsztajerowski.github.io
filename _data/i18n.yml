# Interface text in every language the site speaks. The first language is the
# default: its pages live at /<tab>/, the others at /<tab>/<lang>/.
# Every language must define the same keys (the build checks this).

languages: [pl, en]

# Tab order in the top bar. `path` is shared by all languages.
tabs:
  - key: talks
    path: /talks/
  - key: projects
    path: /projects/
  - key: about
    path: /about/

